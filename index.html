<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>English Flow - Practice Room</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="bg-slate-50 text-slate-800 font-sans min-h-screen flex flex-col md:flex-row">

    <script>
        const SUPABASE_URL = "https://wfpphviaosfedotbitvb.supabase.co"; 
        const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6IndmcHBodmlhb3NmZWRvdGJpdnRiIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODAwNjI0MzgsImV4cCI6MjA5NTYzODQzOH0.HyY11YK2hjmRogCGMKcB_s6EpwGM7OQbFtR7HNTLryQ";
        const supabase = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
        
        let currentUser = null;
        let userProfile = { role: 'student', full_name: 'Guest Student' }; // Default fallback fallback
    </script>

    <aside class="w-full md:w-64 bg-slate-900 text-white flex flex-col justify-between p-4 shadow-xl shrink-0">
        <div>
            <div class="flex items-center gap-3 mb-8 px-2">
                <div class="bg-indigo-600 p-2 rounded-lg text-white">
                    <i data-lucide="graduation-cap"></i>
                </div>
                <div>
                    <h1 class="font-bold text-lg leading-none">English Flow</h1>
                    <span class="text-xs text-slate-400">Class Manager</span>
                </div>
            </div>
            
            <nav class="space-y-1">
                <button onclick="switchPage('tasks')" id="nav-tasks" class="w-full flex items-center gap-3 px-3 py-2.5 rounded-lg text-sm font-medium bg-slate-800 text-white transition-colors">
                    <i data-lucide="check-square" class="w-4 h-4"></i> Tasks List
                </button>
                <button onclick="switchPage('chat')" id="nav-chat" class="w-full flex items-center gap-3 px-3 py-2.5 rounded-lg text-sm font-medium text-slate-400 hover:bg-slate-800 hover:text-white transition-colors">
                    <i data-lucide="message-square" class="w-4 h-4"></i> Group Chat
                </button>
                <button onclick="switchPage('stats')" id="nav-stats" class="w-full flex items-center gap-3 px-3 py-2.5 rounded-lg text-sm font-medium text-slate-400 hover:bg-slate-800 hover:text-white transition-colors">
                    <i data-lucide="bar-chart-3" class="w-4 h-4"></i> Statistics
                </button>
            </nav>
        </div>

        <div class="mt-auto border-t border-slate-800 pt-4 flex items-center justify-between">
            <div class="flex items-center gap-2">
                <div class="w-8 h-8 rounded-full bg-indigo-500/20 text-indigo-400 flex items-center justify-center font-bold text-sm" id="user-avatar">S</div>
                <div>
                    <p class="text-sm font-semibold truncate max-w-[120px]" id="user-name">Loading...</p>
                    <span id="role-badge" class="text-[10px] uppercase tracking-wider font-extrabold px-1.5 py-0.5 rounded bg-emerald-500/20 text-emerald-400">Student</span>
                </div>
            </div>
            <button onclick="toggleRoleMock()" title="Toggle Role (Testing Mode)" class="p-1.5 text-slate-400 hover:text-white hover:bg-slate-800 rounded">
                <i data-lucide="refresh-cw" class="w-4 h-4"></i>
            </button>
        </div>
    </aside>

    <main class="flex-1 flex flex-col min-w-0">
        <header class="bg-white border-b border-slate-200 py-4 px-6 flex items-center justify-between shadow-sm">
            <div id="page-title-area">
                <h2 class="text-xl font-bold tracking-tight text-slate-900" id="current-page-title">Tasks List</h2>
            </div>
            <div class="text-sm text-slate-500 font-medium bg-slate-100 px-3 py-1.5 rounded-full" id="live-date">
                Loading Date...
            </div>
        </header>

        <div class="flex-1 p-4 md:p-8 overflow-y-auto">
            
            <section id="page-tasks" class="space-y-6">
                <div id="teacher-creation-panel" class="hidden bg-white p-5 border border-slate-200 rounded-xl shadow-sm space-y-4">
                    <h3 class="font-bold text-base text-slate-900 flex items-center gap-2">
                        <i data-lucide="plus-circle" class="text-indigo-600 w-5 h-5"></i> Post Extra Assignment For Today
                    </h3>
                    <div class="grid grid-cols-1 md:grid-cols-3 gap-3">
                        <input type="text" id="task-desc-input" placeholder="Task description (e.g. Complete Reading Test 4, Passage 1)" class="md:col-span-2 text-sm border border-slate-300 rounded-lg p-2.5 focus:ring-2 focus:ring-indigo-500 outline-none">
                        <input type="number" id="task-time-input" placeholder="Allotted Minutes (e.g. 20)" class="text-sm border border-slate-300 rounded-lg p-2.5 focus:ring-2 focus:ring-indigo-500 outline-none">
                    </div>
                    <button onclick="createNewTask()" class="bg-indigo-600 hover:bg-indigo-700 text-white font-medium text-sm px-5 py-2.5 rounded-lg shadow-sm transition-all flex items-center justify-center gap-2 w-full md:w-auto">
                        Publish Task
                    </button>
                </div>

                <div id="student-progress-banner" class="bg-gradient-to-r from-indigo-600 to-violet-600 text-white p-5 rounded-xl shadow-md flex items-center justify-between">
                    <div>
                        <h3 class="text-lg font-bold">Your Progress Today</h3>
                        <p class="text-indigo-100 text-xs">Complete all assignments to hit 100% efficiency!</p>
                    </div>
                    <div class="text-right">
                        <span class="text-3xl font-extrabold" id="completion-percentage">0%</span>
                    </div>
                </div>

                <div class="space-y-3" id="tasks-injection-node">
                    </div>
            </section>


            <section id="page-chat" class="hidden flex flex-col h-[calc(100vh-12rem)] md:h-[calc(100vh-10rem)] bg-white border border-slate-200 rounded-xl overflow-hidden shadow-sm">
                <div id="chat-stream" class="flex-1 p-4 overflow-y-auto space-y-4 bg-slate-50">
                    </div>

                <div class="p-3 border-t border-slate-200 bg-white flex flex-col gap-2">
                    <div id="preview-container" class="hidden relative inline-block self-start border rounded-lg p-1 bg-slate-100">
                        <span id="file-name-preview" class="text-xs text-slate-600 px-2"></span>
                        <button onclick="clearFileSelection()" class="text-red-500 hover:text-red-700 font-bold text-xs p-1">✕</button>
                    </div>
                    <div class="flex items-center gap-2">
                        <label class="cursor-pointer p-2.5 text-slate-500 hover:text-indigo-600 hover:bg-slate-50 rounded-lg transition-colors shrink-0">
                            <i data-lucide="image" class="w-5 h-5"></i>
                            <input type="file" id="chat-file-input" accept="image/*" class="hidden" onchange="handleFileSelect()">
                        </label>
                        <input type="text" id="chat-msg-input" placeholder="Type an instructional message or update..." class="flex-1 text-sm border border-slate-300 rounded-lg p-2.5 outline-none focus:ring-2 focus:ring-indigo-500" onkeydown="if(event.key === 'Enter') sendChatMessage()">
                        <button onclick="sendChatMessage()" class="bg-indigo-600 text-white p-2.5 rounded-lg shadow hover:bg-indigo-700 transition-colors shrink-0">
                            <i data-lucide="send" class="w-5 h-5"></i>
                        </button>
                    </div>
                </div>
            </section>


            <section id="page-stats" class="hidden space-y-6">
                <div class="bg-white border border-slate-200 rounded-xl p-5 shadow-sm">
                    <h3 class="font-bold text-lg mb-4 flex items-center gap-2">
                        <i data-lucide="trending-up" class="text-emerald-500"></i> Performance Leaderboard
                    </h3>
                    <div class="overflow-x-auto">
                        <table class="w-full text-left border-collapse text-sm">
                            <thead>
                                <tr class="border-b border-slate-200 text-slate-400 font-medium">
                                    <th class="py-3 px-4">Student Name</th>
                                    <th class="py-3 px-4">Role</th>
                                    <th class="py-3 px-4 text-right">Completion Rate (Today)</th>
                                </tr>
                            </thead>
                            <tbody id="stats-table-body">
                                </tbody>
                        </table>
                    </div>
                </div>
            </section>

        </div>
    </main>

    <script>
        // Init App States
        document.getElementById('live-date').innerText = new Date().toLocaleDateString('en-US', { weekday: 'long', month: 'short', day: 'numeric' });

        function switchPage(pageId) {
            ['tasks', 'chat', 'stats'].forEach(p => {
                document.getElementById(`page-${p}`).classList.add('hidden');
                document.getElementById(`nav-${p}`).classList.remove('bg-slate-800', 'text-white');
                document.getElementById(`nav-${p}`).classList.add('text-slate-400');
            });
            document.getElementById(`page-${pageId}`).classList.remove('hidden');
            document.getElementById(`nav-${pageId}`).classList.add('bg-slate-800', 'text-white');
            document.getElementById(`current-page-title`).innerText = pageId.charAt(0).toUpperCase() + pageId.slice(1) + " Dashboard";
            
            if(pageId === 'tasks') loadTasks();
            if(pageId === 'chat') { loadChatHistory(); scrollChatBottom(); }
            if(pageId === 'stats') loadStatistics();
        }

        function toggleRoleMock() {
            userProfile.role = userProfile.role === 'student' ? 'teacher' : 'student';
            userProfile.full_name = userProfile.role === 'teacher' ? 'Mr. Zufar' : 'Zufar (Student)';
            applyRoleUIStyles();
        }

        function applyRoleUIStyles() {
            document.getElementById('user-name').innerText = userProfile.full_name;
            document.getElementById('user-avatar').innerText = userProfile.full_name.charAt(0);
            
            const badge = document.getElementById('role-badge');
            badge.innerText = userProfile.role;
            
            if(userProfile.role === 'teacher') {
                badge.className = "text-[10px] uppercase tracking-wider font-extrabold px-1.5 py-0.5 rounded bg-amber-500/20 text-amber-500";
                document.getElementById('teacher-creation-panel').classList.remove('hidden');
                document.getElementById('student-progress-banner').classList.add('hidden');
            } else {
                badge.className = "text-[10px] uppercase tracking-wider font-extrabold px-1.5 py-0.5 rounded bg-emerald-500/20 text-emerald-400";
                document.getElementById('teacher-creation-panel').classList.add('hidden');
                document.getElementById('student-progress-banner').classList.remove('hidden');
            }
            loadTasks();
        }

        // --- CORE DATABASE OPERATIONS ---

        async function loadTasks() {
            // Mock individual dynamic authentication injection for testing schema parameters
            // Fetch tasks for the current calendar date
            const { data: tasks, error } = await supabase.from('tasks').select('*').order('created_at', { ascending: true });
            if (error) return console.error(error);

            const listNode = document.getElementById('tasks-injection-node');
            listNode.innerHTML = '';

            if(tasks.length === 0) {
                listNode.innerHTML = `<div class="text-center py-8 text-slate-400 text-sm">No tasks assigned for today yet.</div>`;
                return;
            }

            tasks.forEach(task => {
                const card = document.createElement('div');
                card.className = "bg-white p-4 border border-slate-200 rounded-xl shadow-sm flex items-center justify-between gap-4";
                
                // Left view elements
                card.innerHTML = `
                    <div class="flex items-center gap-3">
                        <input type="checkbox" id="task-chk-${task.id}" onchange="toggleTaskTick(${task.id})" class="w-5 h-5 text-indigo-600 border-slate-300 rounded focus:ring-indigo-500 cursor-pointer">
                        <div>
                            <p class="text-sm font-semibold text-slate-800">${task.description}</p>
                            <span class="text-xs text-slate-400 inline-flex items-center gap-1 mt-0.5">⏱️ ${task.duration_mins} mins</span>
                        </div>
                    </div>
                `;
                listNode.appendChild(card);
            });
            updateCompletionBanner(tasks.length, 0); // Dynamic values hooked when live user authentication links are finalized
        }

        async function createNewTask() {
            const desc = document.getElementById('task-desc-input').value;
            const mins = document.getElementById('task-time-input').value;
            if(!desc || !mins) return alert('Fill in all text areas!');

            const { error } = await supabase.from('tasks').insert([{ description: desc, duration_mins: parseInt(mins) }]);
            if (error) alert(error.message);
            
            document.getElementById('task-desc-input').value = '';
            document.getElementById('task-time-input').value = '';
            loadTasks();
        }

        function updateCompletionBanner(total, done) {
            const percentage = total === 0 ? 0 : Math.round((done / total) * 100);
            document.getElementById('completion-percentage').innerText = `${percentage}%`;
        }

        // --- MOCK AND CHAT CONTROLLERS ---
        function handleFileSelect() {
            const file = document.getElementById('chat-file-input').files[0];
            if(file) {
                document.getElementById('preview-container').classList.remove('hidden');
                document.getElementById('file-name-preview').innerText = file.name;
            }
        }
        function clearFileSelection() {
            document.getElementById('chat-file-input').value = '';
            document.getElementById('preview-container').classList.add('hidden');
        }

        async function loadChatHistory() {
            const stream = document.getElementById('chat-stream');
            stream.innerHTML = `<div class="text-center text-xs text-slate-400">Loading continuous chat log...</div>`;
            // Pull real messages stream from Supabase table logic
            stream.innerHTML = `
                <div class="flex flex-col items-start gap-1 max-w-[80%]">
                    <span class="text-[10px] text-slate-400 ml-2">Mr. Zufar (Teacher)</span>
                    <div class="bg-indigo-600 text-white text-sm p-3 rounded-2xl rounded-tl-none shadow-sm">
                        Welcome to the online extra practice stream! Post screenshots here if you hit obstacles during processing tasks.
                    </div>
                </div>
            `;
        }

        function sendChatMessage() {
            const input = document.getElementById('chat-msg-input');
            if(!input.value.trim() && !document.getElementById('chat-file-input').files[0]) return;
            // Handle optional storage insertion pipeline for file uploads if storage is enabled 
            input.value = '';
            clearFileSelection();
        }

        function scrollChatBottom() {
            const stream = document.getElementById('chat-stream');
            stream.scrollTop = stream.scrollHeight;
        }

        function loadStatistics() {
            const table = document.getElementById('stats-table-body');
            table.innerHTML = `
                <tr class="border-b border-slate-100 hover:bg-slate-50 transition-colors">
                    <td class="py-3 px-4 font-semibold text-slate-800">Zufar (Student)</td>
                    <td class="py-3 px-4 text-slate-500 text-xs">Student</td>
                    <td class="py-3 px-4 text-right font-bold text-amber-600">50% Complete</td>
                </tr>
                <tr class="border-b border-slate-100 hover:bg-slate-50 transition-colors">
                    <td class="py-3 px-4 font-semibold text-slate-800">Mr. Zufar</td>
                    <td class="py-3 px-4 text-slate-500 text-xs">Teacher</td>
                    <td class="py-3 px-4 text-right font-bold text-emerald-600">100% (Admin)</td>
                </tr>
            `;
        }

        // Initialize Icons and Default State
        window.onload = () => {
            lucide.createIcons();
            toggleRoleMock(); // Default boot into standard validation
        };
    </script>
</body>
</html>
