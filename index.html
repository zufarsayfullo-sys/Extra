<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>English Flow - Practice Room</title>
    <!-- Telegram Web App Script -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Supabase JS Library CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <!-- Lucide Icons for Dashboard UI -->
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="bg-slate-50 text-slate-800 font-sans min-h-screen flex flex-col md:flex-row pb-16 md:pb-0">

    <script>
        // Configuration
        const SUPABASE_URL = "https://wfpphviaosfedotbitvb.supabase.co"; 
        const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6IndmcHBodmlhb3NmZWRvdGJpdnRiIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODAwNjI0MzgsImV4cCI6MjA5NTYzODQzOH0.HyY11YK2hjmRogCGMKcB_s6EpwGM7OQbFtR7HNTLryQ";
        const supabase = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
        
        // Telegram App Configuration
        const tg = window.Telegram?.WebApp;
        if (tg) {
            tg.ready();
            tg.expand();
        }

        let currentUser = null;
        let userProfile = { role: 'student', full_name: 'Guest Student' };
    </script>

    <!-- SIDEBAR NAVIGATION (Desktop) -->
    <aside class="hidden md:flex w-64 bg-slate-900 text-white flex-col justify-between p-4 shadow-xl shrink-0">
        <div>
            <div class="flex items-center gap-3 mb-8 px-2">
                <div class="bg-indigo-600 p-2 rounded-lg text-white">
                    <i data-lucide="graduation-cap"></i>
                </div>
                <div>
                    <h1 class="font-bold text-lg leading-none">English Flow</h1>
                    <span class="text-xs text-slate-400">Practice Dashboard</span>
                </div>
            </div>
            
            <nav class="space-y-1">
                <button onclick="switchPage('tasks')" id="dk-nav-tasks" class="w-full flex items-center gap-3 px-3 py-2.5 rounded-lg text-sm font-medium bg-slate-800 text-white transition-colors">
                    <i data-lucide="check-square" class="w-4 h-4"></i> Tasks List
                </button>
                <button onclick="switchPage('chat')" id="dk-nav-chat" class="w-full flex items-center gap-3 px-3 py-2.5 rounded-lg text-sm font-medium text-slate-400 hover:bg-slate-800 hover:text-white transition-colors">
                    <i data-lucide="message-square" class="w-4 h-4"></i> Group Chat
                </button>
                <button onclick="switchPage('stats')" id="dk-nav-stats" class="w-full flex items-center gap-3 px-3 py-2.5 rounded-lg text-sm font-medium text-slate-400 hover:bg-slate-800 hover:text-white transition-colors">
                    <i data-lucide="bar-chart-3" class="w-4 h-4"></i> Statistics
                </button>
            </nav>
        </div>

        <div class="border-t border-slate-800 pt-4 flex items-center gap-2">
            <div class="w-8 h-8 rounded-full bg-indigo-500/20 text-indigo-400 flex items-center justify-center font-bold text-sm" id="user-avatar-dk">G</div>
            <div>
                <p class="text-sm font-semibold truncate max-w-[140px]" id="user-name-dk">Loading...</p>
                <span id="role-badge-dk" class="text-[10px] uppercase tracking-wider font-extrabold px-1.5 py-0.5 rounded bg-emerald-500/20 text-emerald-400">Student</span>
            </div>
        </div>
    </aside>

    <!-- MOBILE BOTTOM NAVIGATION -->
    <nav class="md:hidden fixed bottom-0 left-0 right-0 bg-slate-950 border-t border-slate-800 px-6 py-2 flex justify-around items-center z-50 shadow-lg">
        <button onclick="switchPage('tasks')" id="mb-nav-tasks" class="flex flex-col items-center gap-1 text-indigo-400">
            <i data-lucide="check-square" class="w-5 h-5"></i>
            <span class="text-[10px] font-medium">Tasks</span>
        </button>
        <button onclick="switchPage('chat')" id="mb-nav-chat" class="flex flex-col items-center gap-1 text-slate-400">
            <i data-lucide="message-square" class="w-5 h-5"></i>
            <span class="text-[10px] font-medium">Chat</span>
        </button>
        <button onclick="switchPage('stats')" id="mb-nav-stats" class="flex flex-col items-center gap-1 text-slate-400">
            <i data-lucide="bar-chart-3" class="w-5 h-5"></i>
            <span class="text-[10px] font-medium">Stats</span>
        </button>
    </nav>

    <!-- MAIN APP VIEWPORT -->
    <main class="flex-1 flex flex-col min-w-0">
        <!-- Header -->
        <header class="bg-white border-b border-slate-200 py-3 px-4 md:py-4 md:px-6 flex items-center justify-between shadow-sm">
            <div class="flex items-center gap-2 md:gap-0">
                <!-- Mobile Avatar -->
                <div class="md:hidden w-7 h-7 rounded-full bg-indigo-600 text-white flex items-center justify-center text-xs font-bold mr-1" id="user-avatar-mb">G</div>
                <h2 class="text-lg md:text-xl font-bold tracking-tight text-slate-900" id="current-page-title">Tasks List</h2>
            </div>
            <div class="text-xs md:text-sm text-slate-500 font-medium bg-slate-100 px-2.5 py-1 md:px-3 md:py-1.5 rounded-full" id="live-date">
                Date Loading...
            </div>
        </header>

        <!-- ROUTER CONTENT SHEETS -->
        <div class="flex-1 p-4 md:p-8 overflow-y-auto">
            
            <!-- PAGE 1: TASKS PANEL -->
            <section id="page-tasks" class="space-y-4 md:space-y-6">
                <!-- Teacher Creation Dashboard Box -->
                <div id="teacher-creation-panel" class="hidden bg-white p-4 md:p-5 border border-slate-200 rounded-xl shadow-sm space-y-4">
                    <h3 class="font-bold text-sm md:text-base text-slate-900 flex items-center gap-2">
                        <i data-lucide="plus-circle" class="text-indigo-600 w-5 h-5"></i> Add Extra Homework Assignment
                    </h3>
                    <div class="grid grid-cols-1 md:grid-cols-3 gap-3">
                        <input type="text" id="task-desc-input" placeholder="Task description..." class="md:col-span-2 text-sm border border-slate-300 rounded-lg p-2.5 focus:ring-2 focus:ring-indigo-500 outline-none">
                        <input type="number" id="task-time-input" placeholder="Minutes (e.g. 25)" class="text-sm border border-slate-300 rounded-lg p-2.5 focus:ring-2 focus:ring-indigo-500 outline-none">
                    </div>
                    <button onclick="createNewTask()" class="bg-indigo-600 hover:bg-indigo-700 text-white font-medium text-sm px-5 py-2.5 rounded-lg shadow-sm w-full md:w-auto transition-all">
                        Publish Task
                    </button>
                </div>

                <!-- Student Dynamic Focus Ring Banner -->
                <div id="student-progress-banner" class="bg-gradient-to-r from-indigo-600 to-violet-600 text-white p-4 md:p-5 rounded-xl shadow-md flex items-center justify-between">
                    <div>
                        <h3 class="text-sm md:text-lg font-bold">Your Focus Progress</h3>
                        <p class="text-indigo-100 text-[11px] md:text-xs">All tasks completed equals 100% score!</p>
                    </div>
                    <div class="text-right">
                        <span class="text-2xl md:text-3xl font-extrabold" id="completion-percentage">0%</span>
                    </div>
                </div>

                <!-- Tasks Anchor Nodes -->
                <div class="space-y-3" id="tasks-injection-node"></div>
            </section>

            <!-- PAGE 2: MAIN GROUP CHAT CONTAINER -->
            <section id="page-chat" class="hidden flex flex-col h-[calc(100vh-10rem)] md:h-[calc(100vh-9rem)] bg-white border border-slate-200 rounded-xl overflow-hidden shadow-sm">
                <div id="chat-stream" class="flex-1 p-4 overflow-y-auto space-y-4 bg-slate-50 flex flex-col"></div>

                <div class="p-3 border-t border-slate-200 bg-white flex flex-col gap-2">
                    <div id="preview-container" class="hidden relative inline-block self-start border rounded-lg p-1 bg-slate-100">
                        <span id="file-name-preview" class="text-xs text-slate-600 px-2"></span>
                        <button onclick="clearFileSelection()" class="text-red-500 hover:text-red-700 font-bold text-xs p-1">✕</button>
                    </div>
                    <div class="flex items-center gap-2">
                        <label class="cursor-pointer p-2.5 text-slate-500 hover:text-indigo-600 hover:bg-slate-50 rounded-lg shrink-0">
                            <i data-lucide="image" class="w-5 h-5"></i>
                            <input type="file" id="chat-file-input" accept="image/*" class="hidden" onchange="handleFileSelect()">
                        </label>
                        <input type="text" id="chat-msg-input" placeholder="Type a text update here..." class="flex-1 text-sm border border-slate-300 rounded-lg p-2.5 outline-none focus:ring-2 focus:ring-indigo-500">
                        <button onclick="sendChatMessage()" class="bg-indigo-600 text-white p-2.5 rounded-lg shadow hover:bg-indigo-700 shrink-0">
                            <i data-lucide="send" class="w-5 h-5"></i>
                        </button>
                    </div>
                </div>
            </section>

            <!-- PAGE 3: PERFORMANCE METRICS -->
            <section id="page-stats" class="hidden space-y-6">
                <div class="bg-white border border-slate-200 rounded-xl p-4 md:p-5 shadow-sm">
                    <h3 class="font-bold text-base md:text-lg mb-4 flex items-center gap-2">
                        <i data-lucide="trending-up" class="text-emerald-500 w-5 h-5"></i> Class Progress Leaderboard
                    </h3>
                    <div class="overflow-x-auto">
                        <table class="w-full text-left border-collapse text-xs md:text-sm">
                            <thead>
                                <tr class="border-b border-slate-200 text-slate-400 font-medium">
                                    <th class="py-3 px-4">Student</th>
                                    <th class="py-3 px-4 text-right">Completion Status</th>
                                </tr>
                            </thead>
                            <tbody id="stats-table-body"></tbody>
                        </table>
                    </div>
                </div>
            </section>

        </div>
    </main>

    <!-- CORE LOGIC FRAMEWORK -->
    <script>
        document.getElementById('live-date').innerText = new Date().toLocaleDateString('en-US', { weekday: 'short', month: 'short', day: 'numeric' });

        function switchPage(pageId) {
            ['tasks', 'chat', 'stats'].forEach(p => {
                document.getElementById(`page-${p}`).classList.add('hidden');
                
                // Desktop Nav Style Update
                document.getElementById(`dk-nav-${p}`).classList.remove('bg-slate-800', 'text-white');
                document.getElementById(`dk-nav-${p}`).classList.add('text-slate-400');
                
                // Mobile Nav Style Update
                document.getElementById(`mb-nav-${p}`).classList.remove('text-indigo-400');
                document.getElementById(`mb-nav-${p}`).classList.add('text-slate-400');
            });

            document.getElementById(`page-${pageId}`).classList.remove('hidden');
            document.getElementById(`dk-nav-${pageId}`).classList.add('bg-slate-800', 'text-white');
            document.getElementById(`mb-nav-${pageId}`).classList.add('text-indigo-400');
            document.getElementById(`mb-nav-${pageId}`).classList.remove('text-slate-400');

            document.getElementById(`current-page-title`).innerText = pageId.charAt(0).toUpperCase() + pageId.slice(1);
            
            if (pageId === 'tasks') loadTasks();
            if (pageId === 'chat') { loadChatHistory(); setupChatSubscription(); }
            if (pageId === 'stats') loadStatistics();
        }

        // --- AUTHENTICATION & INTERFACE ADAPTATION ---
        async function initTelegramAuth() {
            let tgUser = { id: "11111111-1111-1111-1111-111111111111", first_name: "Local", last_name: "User" };

            if (tg?.initDataUnsafe?.user) {
                const raw = tg.initDataUnsafe.user;
                tgUser = {
                    id: `00000000-0000-0000-0000-${String(raw.id).padStart(12, '0')}`,
                    first_name: raw.first_name || '',
                    last_name: raw.last_name || ''
                };
            }

            const fullName = `${tgUser.first_name} ${tgUser.last_name}`.trim();
            currentUser = { id: tgUser.id };

            // Upsert metadata directly inside Supabase profiles
            await supabase.from('profiles').upsert({ id: currentUser.id, full_name: fullName }, { onConflict: 'id' });

            // Read authoritative role assigned by teacher
            const { data: profile } = await supabase.from('profiles').select('role, full_name').eq('id', currentUser.id).single();
            if (profile) userProfile = profile;

            applyRoleStyles();
        }

        function applyRoleStyles() {
            document.getElementById('user-name-dk').innerText = userProfile.full_name;
            document.getElementById('user-avatar-dk').innerText = userProfile.full_name.charAt(0);
            document.getElementById('user-avatar-mb').innerText = userProfile.full_name.charAt(0);
            
            const badge = document.getElementById('role-badge-dk');
            badge.innerText = userProfile.role;

            if (userProfile.role === 'teacher') {
                badge.className = "text-[10px] uppercase tracking-wider font-extrabold px-1.5 py-0.5 rounded bg-amber-500/20 text-amber-500";
                document.getElementById('teacher-creation-panel').classList.remove('hidden');
                document.getElementById('student-progress-banner').classList.add('hidden');
            } else {
                badge.className = "text-[10px] uppercase tracking-wider font-extrabold px-1.5 py-0.5 rounded bg-emerald-500/20 text-emerald-400";
                document.getElementById('teacher-creation-panel').classList.add('hidden');
                document.getElementById('student-progress-banner').classList.remove('hidden');
            }
            loadTasks();
        }

        // --- TASKS ENGINE CONTROLLERS ---
        async function loadTasks() {
            const { data: tasks } = await supabase.from('tasks').select('*').order('created_at', { ascending: true });
            const { data: submissions } = await supabase.from('task_submissions').select('task_id').eq('student_id', currentUser.id);
            
            const completedIds = new Set(submissions?.map(s => s.task_id) || []);
            const container = document.getElementById('tasks-injection-node');
            container.innerHTML = '';

            if (!tasks || tasks.length === 0) {
                container.innerHTML = `<div class="text-center py-8 text-slate-400 text-xs">No active assignments today.</div>`;
                updateCompletionBanner(0, 0);
                return;
            }

            let doneCount = 0;
            tasks.forEach(task => {
                const isChecked = completedIds.has(task.id);
                if (isChecked) doneCount++;

                const card = document.createElement('div');
                card.className = `bg-white p-4 border border-slate-200 rounded-xl shadow-sm flex items-center justify-between transition-all ${isChecked ? 'bg-slate-50/70 opacity-70' : ''}`;
                card.innerHTML = `
                    <div class="flex items-center gap-3 w-full">
                        <input type="checkbox" id="task-chk-${task.id}" ${isChecked ? 'checked' : ''} onchange="toggleTaskTick(${task.id}, this.checked)" class="w-5 h-5 text-indigo-600 border-slate-300 rounded cursor-pointer shrink-0 focus:ring-indigo-500">
                        <div class="min-w-0">
                            <p class="text-sm font-semibold text-slate-800 truncate ${isChecked ? 'line-through text-slate-400' : ''}">${task.description}</p>
                            <span class="text-[11px] text-slate-400 font-medium inline-flex items-center gap-1 mt-0.5">⏱️ ${task.duration_mins} mins</span>
                        </div>
                    </div>
                `;
                container.appendChild(card);
            });

            updateCompletionBanner(tasks.length, doneCount);
        }

        async function createNewTask() {
            const desc = document.getElementById('task-desc-input').value.trim();
            const mins = document.getElementById('task-time-input').value.trim();
            if (!desc || !mins) return alert('Enter task description and duration!');

            await supabase.from('tasks').insert([{ description: desc, duration_mins: parseInt(mins) }]);
            document.getElementById('task-desc-input').value = '';
            document.getElementById('task-time-input').value = '';
            loadTasks();
        }

        async function toggleTaskTick(taskId, isChecked) {
            if (isChecked) {
                await supabase.from('task_submissions').insert([{ student_id: currentUser.id, task_id: taskId }]);
            } else {
                await supabase.from('task_submissions').delete().eq('student_id', currentUser.id).eq('task_id', taskId);
            }
            loadTasks();
        }

        function updateCompletionBanner(total, done) {
            const pct = total === 0 ? 0 : Math.round((done / total) * 100);
            const label = document.getElementById('completion-percentage');
            if(label) label.innerText = `${pct}%`;
        }

        // --- CHAT SYSTEM PLATFORM ---
        function handleFileSelect() {
            const file = document.getElementById('chat-file-input').files[0];
            if (file) {
                document.getElementById('preview-container').classList.remove('hidden');
                document.getElementById('file-name-preview').innerText = file.name;
            }
        }

        function clearFileSelection() {
            document.getElementById('chat-file-input').value = '';
            document.getElementById('preview-container').classList.add('hidden');
        }

        async function loadChatHistory() {
            const { data: messages } = await supabase.from('messages').select(`*, profiles(full_name, role)`).order('created_at', { ascending: true });
            const stream = document.getElementById('chat-stream');
            stream.innerHTML = '';

            messages?.forEach(msg => {
                const self = msg.sender_id === currentUser.id;
                const isTeacher = msg.profiles?.role === 'teacher';
                const bubble = document.createElement('div');
                
                bubble.className = `flex flex-col mb-2 max-w-[85%] ${self ? 'self-end items-end' : 'self-start items-start'}`;
                bubble.innerHTML = `
                    <span class="text-[10px] text-slate-400 px-1 mb-0.5">${msg.profiles?.full_name || 'User'} ${isTeacher ? '👑' : ''}</span>
                    <div class="p-3 rounded-2xl text-sm shadow-sm ${self ? 'bg-indigo-600 text-white rounded-tr-none' : 'bg-white text-slate-800 border border-slate-200 rounded-tl-none'}">
                        ${msg.image_url ? `<img src="${msg.image_url}" class="rounded-lg mb-1.5 max-h-48 object-cover" />` : ''}
                        <p class="break-words leading-relaxed">${msg.message_text || ''}</p>
                    </div>
                `;
                stream.appendChild(bubble);
            });
            stream.scrollTop = stream.scrollHeight;
        }

        async function sendChatMessage() {
            const textInput = document.getElementById('chat-msg-input');
            const fileInput = document.getElementById('chat-file-input');
            const text = textInput.value.trim();
            const file = fileInput.files[0];

            if (!text && !file) return;

            let uploadedUrl = null;
            if (file) {
                const fileExt = file.name.split('.').pop();
                const fileName = `${Math.random()}.${fileExt}`;
                const { data } = await supabase.storage.from('chat-attachments').upload(fileName, file);
                if (data) {
                    uploadedUrl = `${SUPABASE_URL}/storage/v1/object/public/chat-attachments/${fileName}`;
                }
            }

            await supabase.from('messages').insert([{ sender_id: currentUser.id, message_text: text, image_url: uploadedUrl }]);
            textInput.value = '';
            clearFileSelection();
            loadChatHistory();
        }

        function setupChatSubscription() {
            supabase.channel('public:messages').on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'messages' }, () => {
                loadChatHistory();
            }).subscribe();
        }

        // --- CLASS STATS PANEL ---
        async function loadStatistics() {
            const { data: profiles } = await supabase.from('profiles').select('*');
            const { data: tasks } = await supabase.from('tasks').select('id');
            const { data: submissions } = await supabase.from('task_submissions').select('*');

            const totalCount = tasks?.length || 0;
            const tableBody = document.getElementById('stats-table-body');
            tableBody.innerHTML = '';

            profiles?.forEach(user => {
                const userDone = submissions?.filter(s => s.student_id === user.id).length || 0;
                const pct = totalCount === 0 ? 0 : Math.round((userDone / totalCount) * 100);

                const row = document.createElement('tr');
                row.className = "border-b border-slate-100 hover:bg-slate-50 transition-colors";
                row.innerHTML = `
                    <td class="py-3 px-4 font-semibold text-slate-800">${user.full_name} ${user.role === 'teacher' ? '(Teacher)' : ''}</td>
                    <td class="py-3 px-4 text-right font-bold ${pct === 100 ? 'text-emerald-600' : 'text-amber-600'}">${pct}% Done</td>
                `;
                tableBody.appendChild(row);
            });
        }

        window.onload = async () => {
            lucide.createIcons();
            await initTelegramAuth();
        };
    </script>
</body>
</html>
